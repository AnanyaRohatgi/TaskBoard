name: Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install backend dependencies
        working-directory: ./backend
        run: pip install -r requirements.txt

      - name: Run backend tests
        working-directory: ./backend
        env:
          DJANGO_SECRET_KEY: ci-secret-key
          DJANGO_DEBUG: '1'
          USE_SQLITE: '1'
        run: python manage.py test --verbosity 2

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger backend deploy hook
        env:
          HOOK_URL: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
        run: |
          if [ -n "$HOOK_URL" ]; then
            curl -fsS -X POST "$HOOK_URL"
          else
            echo "Backend deploy hook not configured; skipping deployment."
          fi

      - name: Trigger frontend deploy hook
        env:
          HOOK_URL: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
        run: |
          if [ -n "$HOOK_URL" ]; then
            curl -fsS -X POST "$HOOK_URL"
          else
            echo "Frontend deploy hook not configured; skipping deployment."
          fi
