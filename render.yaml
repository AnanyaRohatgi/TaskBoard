services:
  - type: web
    name: taskboard-api
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: USE_SQLITE
        value: "0"
      - key: ALLOWED_HOSTS
        value: "taskboard-api.onrender.com,localhost,127.0.0.1,0.0.0.0"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://taskboard-frontend.onrender.com,http://localhost:3000"
      - key: FRONTEND_ORIGIN
        value: "https://taskboard-frontend.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: taskboard-db
          property: connectionString

  - type: web
    name: taskboard-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://taskboard-api.onrender.com/api"

 databases:
  - name: taskboard-db
    databaseName: taskboard
    user: taskboard
    plan: free
